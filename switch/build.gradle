plugins {
    id 'java'
}

// The transpile and NRO steps live in scripts/build-switch.sh. This module only
// compiles the launcher and gathers the jars the Clearwing transpiler needs.

java.sourceCompatibility = java.targetCompatibility = appJavaCompatibility

repositories {
    mavenLocal()
    mavenCentral()
    maven { url = 'https://jitpack.io' }
}

configurations {
    transpiler {
        transitive = false
    }
    switchgdx {
        transitive = false
    }
}

dependencies {
    switchgdx "com.thelogicmaster:switch-gdx:$switchGdxVersion"
    transpiler "com.thelogicmaster.clearwing-vm:transpiler:$clearwingVersion"
    implementation project(':core')
    implementation "com.thelogicmaster:switch-gdx:$switchGdxVersion"
    implementation "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-box2d:$gdxVersion"
    implementation project(':services:updates:githubUpdates')
    implementation project(':services:news:shatteredNews')
}

tasks.register('switchDeps', Sync) {
    group = 'SwitchGDX'
    description = 'Collect the transpiler, SwitchGDX and all runtime jars into build/switch-deps'
    dependsOn 'classes'
    into layout.buildDirectory.dir('switch-deps')
    from(configurations.transpiler) { into 'transpiler' }
    from(configurations.switchgdx) { into 'switchgdx' }
    from(configurations.runtimeClasspath.filter { it.isFile() && !it.name.startsWith('switch-gdx-') }) { into 'libs' }
    from(layout.buildDirectory.dir('classes/java/main')) { into 'classes' }
}

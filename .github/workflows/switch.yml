name: Switch build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nro:
    name: Nintendo Switch NRO
    runs-on: ubuntu-24.04
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v7

      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends openjdk-17-jdk-headless unzip rsync cmake ninja-build git ca-certificates
          dkp-pacman -Syu --noconfirm --needed switch-dev switch-cmake switch-pkg-config \
            switch-zlib switch-libvorbis switch-zziplib switch-sdl2 switch-sdl2_mixer \
            switch-freetype switch-glad switch-curl switch-mesa switch-libdrm_nouveau

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Build
        env:
          JOBS: "4"
        run: bash scripts/build-switch.sh

      - name: Rename NRO
        run: cp build/ShatteredPD/build-switch/ShatteredPD.nro ShatteredPD.nro

      - uses: actions/upload-artifact@v7
        with:
          name: ShatteredPD-nro
          path: ShatteredPD.nro

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: ShatteredPD.nro
          generate_release_notes: true
